<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ทอดไข่เจียว | 2D Cinematic Animation</title>
<style>
:root{--ink:#101719;--wall:#354044;--floor:#171817;--warm:#d99b3d;--skin:#c89476;--shirt:#858b89;--blue:#17263b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080d11;color:#f5f2eb;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.app{width:min(100%,520px)}
.screen{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;background:#202b2d;border:1px solid #344044;box-shadow:0 24px 80px #000b;border-radius:12px}
svg{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;pointer-events:none}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 43%,transparent 42%,#05090bc9 100%);pointer-events:none}
.toplabel{position:absolute;top:14px;left:14px;padding:7px 12px;border-radius:7px;background:#e9e7df;color:#242827;font-size:12px;font-weight:700;box-shadow:0 2px 10px #0004}
.caption{position:absolute;left:5%;right:5%;bottom:22%;text-align:center;font-weight:900;font-size:clamp(22px,6vw,34px);line-height:1.35;color:#fff;text-shadow:0 3px 2px #000,0 5px 14px #000;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s}
.caption.show{opacity:1;transform:translateY(0)}
.subcaption{position:absolute;left:8%;right:8%;bottom:16%;text-align:center;font-size:14px;color:#e4e1d8;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .3s}
.subcaption.show{opacity:1}
.controls{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:13px;flex-wrap:wrap}
.controls button{border:1px solid #46545b;background:#1d282e;color:#f7f5ef;border-radius:999px;padding:10px 17px;font-size:14px;font-weight:700;cursor:pointer}
.controls button.primary{background:#d7a34c;color:#20190f;border-color:#e6b963}
.controls button:active{transform:scale(.97)}
.progress{height:5px;background:#293238;border-radius:9px;margin-top:12px;overflow:hidden}
.bar{height:100%;width:0;background:#e0ae59;transition:width .08s linear}
.hint{text-align:center;color:#9da9aa;font-size:12px;line-height:1.6;margin:10px 8px 0}
#steam path{stroke:#d8d7ce;stroke-width:3;fill:none;stroke-linecap:round;opacity:0;animation:steam 2s ease-in-out infinite}
#character{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
#headGroup{transform-box:fill-box;transform-origin:50% 85%;animation:headBob 3.2s ease-in-out infinite}
#blink{transform-origin:center;animation:blink 4.2s infinite}
#leftArm{transform-box:fill-box;transform-origin:88% 12%;animation:armIdle 3s ease-in-out infinite}
#rightArm{transform-box:fill-box;transform-origin:12% 12%;animation:armIdle2 3.4s ease-in-out infinite}
#eggStream{opacity:0}
#eggMix{transform-origin:center;opacity:0}
#pourStream{opacity:0}
#omelette{transform-origin:center;opacity:0;transform:scale(.15)}
#spatula{opacity:0;transform-box:fill-box;transform-origin:20% 15%}
#pan{transform-box:fill-box;transform-origin:center}
#flame{opacity:0}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes headBob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes armIdle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes armIdle2{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.45}100%{opacity:0;transform:translateY(-22px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>

เสียงพูดใช้เสียงภาษาไทยที่ติดตั้งในอุปกรณ์ หากไม่มี ระบบจะเล่นเฉพาะเสียงเอฟเฟกต์</p>

<script>
(() => {
const duration=12000;
const $=id=>document.getElementById(id);
const caption=$('caption'), sub=$('subcaption'), bar=$('bar');

const nodes={
egg:$('eggStream'),
mix:$('eggMix'),
omelette:$('omelette'),
steam:$('steam'),
spatula:$('spatula'),
flame:$('flame'),
left:$('leftArm'),
right:$('rightArm'),
head:$('headGroup'),
pan:$('pan')
};

let startAt=0,elapsed=0,raf=0,running=false,soundOn=true,ctx=null,spoken=-1;

const scenes=[
{t:0,text:'วันนี้เราจะมาทอดไข่เจียวกัน!',sub:'เตรียมไข่ไก่และกระทะให้พร้อม',voice:'วันนี้เราจะมาทอดไข่เจียวกัน'},
{t:2200,text:'ตอกไข่ใส่ชาม',sub:'ค่อย ๆ ตอกไข่ลงในชาม',voice:'ตอกไข่ใส่ชาม'},
{t:4400,text:'ตีไข่ให้เข้ากัน',sub:'ตีจนไข่แดงและไข่ขาวเข้ากัน',voice:'ตีไข่ให้เข้ากัน'},
{t:6800,text:'เทไข่ลงกระทะ',sub:'ตั้งน้ำมันให้ร้อนก่อนเทไข่',voice:'เทไข่ลงกระทะ'},
{t:9300,text:'ทอดจนเหลืองกรอบ!',sub:'กลับด้านให้สุกทั่วกัน',voice:'ทอดจนเหลืองกรอบ'},
{t:11200,text:'เสร็จแล้วจ้า~',sub:'ไข่เจียวร้อน ๆ พร้อมเสิร์ฟ',voice:'เสร็จแล้วจ้า'}
];

function audio(){
if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
if(ctx.state==='suspended')ctx.resume();
return ctx;
}

function tone(freq=440,dur=.12,type='sine',vol=.05,when=0){
if(!soundOn)return;
const c=audio(),o=c.createOscillator(),g=c.createGain();
o.type=type;
o.frequency.setValueAtTime(freq,c.currentTime+when);
g.gain.setValueAtTime(.0001,c.currentTime+when);
g.gain.exponentialRampToValueAtTime(vol,c.currentTime+when+.015);
g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+when+dur);
o.connect(g);g.connect(c.destination);
o.start(c.currentTime+when);
o.stop(c.currentTime+when+dur+.03);
}

function noise(dur=.3,vol=.035){
if(!soundOn)return;
const c=audio(),n=Math.floor(c.sampleRate*dur);
const b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
s.buffer=b;f.type='lowpass';f.frequency.value=1200;
g.gain.setValueAtTime(vol,c.currentTime);
g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}

function effect(index){
if(!soundOn)return;
if(index===1){
tone(900,.06,'triangle',.04);
setTimeout(()=>tone(560,.1,'triangle',.04),90);
}
if(index===2){
for(let i=0;i<5;i++)tone(360+i*55,.06,'triangle',.025,i*.09);
}
if(index===3){
noise(.5,.045);tone(190,.25,'sawtooth',.025);
}
if(index===4){
noise(1.1,.045);
for(let i=0;i<4;i++)tone(120+Math.random()*80,.08,'sine',.018,i*.2);
}
if(index===5){
tone(660,.12,'sine',.035);
tone(880,.25,'sine',.025,.12);
}
}

function speak(text){
if(!soundOn||!('speechSynthesis'in window))return;
window.speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang='th-TH';u.rate=.95;u.pitch=1.0;
const voices=speechSynthesis.getVoices();
const th=voices.find(v=>v.lang.toLowerCase().startsWith('th'));
if(th)u.voice=th;
speechSynthesis.speak(u);
}

function setArm(el,deg){
el.style.animation='none';
el.style.transform=`rotate(${deg}deg)`;
}

function update(ms){
let s=0;
for(let i=0;i<scenes.length;i++)if(ms>=scenes[i].t)s=i;

const scene=scenes[s];
caption.textContent=scene.text;
sub.textContent=scene.sub;
caption.classList.add('show');
sub.classList.add('show');

// Character actions
if(ms<2200){
setArm(nodes.left,-8);setArm(nodes.right,8);
nodes.egg.style.opacity=0;
nodes.mix.style.opacity=0;
nodes.omelette.style.opacity=0;
nodes.steam.style.opacity=0;
}
else if(ms<4400){
setArm(nodes.left,35);setArm(nodes.right,-35);
nodes.egg.style.opacity=1;
nodes.mix.style.opacity=1;
nodes.omelette.style.opacity=0;
nodes.steam.style.opacity=0;
}
else if(ms<6800){
setArm(nodes.left,-20);setArm(nodes.right,38);
nodes.egg.style.opacity=0;
nodes.mix.style.opacity=1;
nodes.omelette.style.opacity=0;
nodes.steam.style.opacity=0;
}
else if(ms<9300){
setArm(nodes.left,22);setArm(nodes.right,-42);
nodes.egg.style.opacity=0;
nodes.mix.style.opacity=0;
nodes.omelette.style.opacity=1;
nodes.omelette.style.transform='scale(.72)';
nodes.steam.style.opacity=.15;
}
else{
setArm(nodes.left,-12);setArm(nodes.right,45);
nodes.egg.style.opacity=0;
nodes.mix.style.opacity=0;
nodes.omelette.style.opacity=1;
nodes.omelette.style.transform='scale(1)';
nodes.steam.style.opacity=1;
}

nodes.spatula?.setAttribute('opacity',ms>=9300?'1':'0');
nodes.flame.style.opacity=(ms>=6800&&ms<11200)?'.9':'0';
nodes.pan.style.transform=(ms>=9300&&ms<11200)?'rotate(-2deg)':'rotate(0deg)';

bar.style.width=Math.min(100,ms/duration*100)+'%';

if(s!==spoken){
spoken=s;
effect(s);
speak(scene.voice);
}
}

function tick(now){
if(!running)return;
elapsed=now-startAt;
if(elapsed>=duration){
elapsed=duration;
update(elapsed);
running=false;
cancelAnimationFrame(raf);
return;
}
update(elapsed);
raf=requestAnimationFrame(tick);
}

function play(){
if(running)return;
audio();
if(elapsed===0){
effect(0);
speak(scenes[0].voice);
spoken=0;
}
running=true;
startAt=performance.now()-elapsed;
raf=requestAnimationFrame(tick);
}

function pause(){
running=false;
cancelAnimationFrame(raf);
if('speechSynthesis'in window)speechSynthesis.pause();
}

function replay(){
pause();
elapsed=0;spoken=-1;
if('speechSynthesis'in window)speechSynthesis.cancel();
update(0);
play();
}

$('play').addEventListener('click',play);
$('pause').addEventListener('click',pause);
$('replay').addEventListener('click',replay);

$('sound').addEventListener('click',()=>{
soundOn=!soundOn;
$('sound').textContent=soundOn?'🔊 เสียง: เปิด':'🔇 เสียง: ปิด';
if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel();
});

spoken=0;
update(0);
})();
</script>
