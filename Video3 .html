
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เบื้องหลังความมหัศจรรย์ของระบบคอมพิวเตอร์</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap');

:root {
  --blue:#3289e8;
  --navy:#102b50;
  --cyan:#77e5ff;
  --purple:#9b83ff;
  --pink:#ff9bc9;
}

* {box-sizing:border-box}

body {
  margin:0;
  font-family:'Prompt',sans-serif;
  background:linear-gradient(135deg,#e5f4ff,#e9e7ff,#fff0f6);
  color:#18375d;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container {
  width:min(1100px,100%);
  background:white;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 20px 70px #5579a32b;
}

.header {
  padding:17px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #e9f0fa;
}

.brand {
  font-size:17px;
  font-weight:700;
  color:#2678d0;
}

.brand span {color:#a18be9}

.header small {
  color:#8ba0b9;
  font-size:11px;
}

.screen {
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  min-height:340px;
  overflow:hidden;
  background:linear-gradient(145deg,#dff5ff,#dce5ff,#f8e6ff);
}

.scene-bg {
  position:absolute;
  inset:0;
  transition:background 1s;
  overflow:hidden;
}

.scene-bg::before {
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  background:#ffffff48;
  top:-250px;
  left:-100px;
}

.scene-bg::after {
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  background:#ffffff35;
  bottom:-250px;
  right:-100px;
}

.scene-1 .scene-bg {background:linear-gradient(135deg,#a9e9ff,#c9c8ff,#f8c9e7)}
.scene-2 .scene-bg {background:linear-gradient(135deg,#b3e9ff,#a4d8ff,#d7e7ff)}
.scene-3 .scene-bg {background:linear-gradient(135deg,#c7baff,#a5c8ff,#e7caff)}
.scene-4 .scene-bg {background:linear-gradient(135deg,#ffe2ed,#d8d9ff,#c5efff)}
.scene-5 .scene-bg {background:linear-gradient(135deg,#b5f0e7,#b5dfff,#e5d5ff)}
.scene-6 .scene-bg {background:linear-gradient(135deg,#a8e9ff,#c8c4ff,#ffd7e9)}

.stars {
  position:absolute;
  inset:0;
  pointer-events:none;
}

.star {
  position:absolute;
  color:white;
  font-size:22px;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from {opacity:.3;transform:scale(.7) rotate(0)}
  to {opacity:1;transform:scale(1.3) rotate(35deg)}
}

.scene-content {
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
}

.scene-label {
  background:#ffffffb8;
  padding:6px 18px;
  border-radius:30px;
  font-size:12px;
  color:#4774aa;
  font-weight:600;
  margin-bottom:12px;
  box-shadow:0 3px 12px #5279a020;
}

.scene-title {
  font-size:clamp(19px,3vw,32px);
  font-weight:800;
  color:#183d70;
  text-shadow:0 2px 0 #ffffff80;
  margin:0 0 12px;
}

.scene-subtitle {
  font-size:clamp(11px,1.5vw,15px);
  color:#41658d;
  margin:0 0 15px;
}

.robot {
  position:relative;
  width:105px;
  height:120px;
  animation:robotFloat 2.5s ease-in-out infinite;
  filter:drop-shadow(0 10px 8px #5479a52e);
  flex-shrink:0;
}

@keyframes robotFloat {
  0%,100% {transform:translateY(0) rotate(-3deg)}
  50% {transform:translateY(-14px) rotate(3deg)}
}

.robot-head {
  position:absolute;
  width:95px;
  height:75px;
  top:13px;
  left:5px;
  border-radius:25px;
  background:linear-gradient(145deg,#ffffff,#b9e9ff);
  border:4px solid #5b9ddc;
  box-shadow:inset -5px -5px 0 #a5d5f4;
}

.robot-head::before {
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  background:#ffb8dc;
  border-radius:50%;
  top:-12px;
  left:37px;
  border:3px solid #5b9ddc;
}

.robot-eyes {
  position:absolute;
  display:flex;
  gap:22px;
  top:24px;
  left:24px;
}

.robot-eyes i {
  width:11px;
  height:14px;
  border-radius:50%;
  background:#294c78;
  display:block;
  position:relative;
}

.robot-eyes i::after {
  content:"";
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:white;
  top:2px;
  right:2px;
}

.robot-mouth {
  position:absolute;
  width:19px;
  height:9px;
  border-bottom:3px solid #ed8cb6;
  border-radius:50%;
  left:35px;
  top:46px;
}

.robot-body {
  position:absolute;
  width:48px;
  height:35px;
  left:29px;
  bottom:0;
  border-radius:12px;
  background:linear-gradient(135deg,#75cfff,#468edc);
  border:3px solid #5b9ddc;
}

.robot-body::after {
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff;
  top:9px;
  left:16px;
}

.robot-arm {
  position:absolute;
  width:12px;
  height:32px;
  border-radius:20px;
  background:#74bff2;
  top:80px;
  animation:wave 1s ease-in-out infinite alternate;
}

.robot-arm.left {left:14px;transform-origin:top}
.robot-arm.right {right:10px;transform-origin:top;animation-delay:.3s}

@keyframes wave {
  to {transform:rotate(35deg)}
}

.ground {
  position:absolute;
  width:85%;
  height:30px;
  border-radius:50%;
  background:#ffffff70;
  bottom:12%;
  left:7.5%;
  filter:blur(2px);
}

.robot-wrap {
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  z-index:3;
}

.robot-speech {
  background:white;
  color:#3b6592;
  border-radius:15px;
  padding:7px 14px;
  font-size:12px;
  box-shadow:0 5px 15px #5579a52a;
  margin-bottom:10px;
  animation:pop .6s;
}

@keyframes pop {
  from {transform:scale(.5);opacity:0}
  to {transform:scale(1);opacity:1}
}

.gift-row {
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:10px;
}

.gift {
  width:55px;
  height:58px;
  position:relative;
  background:linear-gradient(135deg,#ffb8d9,#ff80b9);
  border-radius:7px;
  box-shadow:0 6px 0 #d66eaa;
  animation:giftBounce 1.4s infinite alternate;
}

.gift:nth-child(2){background:linear-gradient(135deg,#a9e7ff,#5fb8ed);animation-delay:.2s}
.gift:nth-child(3){background:linear-gradient(135deg,#d1b9ff,#9776e9);animation-delay:.4s}
.gift:nth-child(4){background:linear-gradient(135deg,#b9f0d6,#69cba1);animation-delay:.6s}
.gift:nth-child(5){background:linear-gradient(135deg,#ffe5a5,#ffb95d);animation-delay:.8s}

.gift::before {
  content:"";
  position:absolute;
  width:10px;
  height:100%;
  background:#ffffff80;
  left:22px;
}

.gift::after {
  content:"";
  position:absolute;
  width:20px;
  height:10px;
  border:4px solid white;
  border-radius:50%;
  top:-10px;
  left:10px;
}

@keyframes giftBounce {
  to {transform:translateY(-10px) rotate(4deg)}
}

.object-row {
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:8px;
}

.object {
  width:72px;
  height:68px;
  border-radius:18px;
  background:#ffffffd9;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:31px;
  box-shadow:0 7px 15px #476b9525;
  animation:objectFloat 2s infinite alternate;
}

.object:nth-child(2){animation-delay:.3s}
.object:nth-child(3){animation-delay:.6s}
.object:nth-child(4){animation-delay:.9s}

.object small {
  font-size:9px;
  color:#476b95;
  font-weight:600;
  margin-top:2px;
}

@keyframes objectFloat {
  to {transform:translateY(-10px) rotate(3deg)}
}

.computer {
  position:relative;
  width:180px;
  height:130px;
  margin:5px auto;
  animation:computerIn 1s;
}

@keyframes computerIn {
  from {transform:scale(.5);opacity:0}
  to {transform:scale(1);opacity:1}
}

.monitor {
  width:155px;
  height:105px;
  background:linear-gradient(135deg,#2868a5,#172c53);
  border:7px solid #e9f8ff;
  border-radius:13px;
  margin:auto;
  box-shadow:0 7px 15px #345c843b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8ceaff;
  font-size:40px;
}

.monitor-stand {
  width:45px;
  height:12px;
  background:#e9f8ff;
  margin:auto;
}

.monitor-base {
  width:80px;
  height:7px;
  background:#c3e7ff;
  margin:auto;
  border-radius:10px;
}

.software-icons {
  display:flex;
  gap:15px;
  justify-content:center;
  margin-top:10px;
}

.app-icon {
  width:49px;
  height:49px;
  background:#ffffffd9;
  border-radius:14px;
  font-size:27px;
  display:grid;
  place-items:center;
  box-shadow:0 5px 15px #4a5f8c29;
  animation:appFloat 1.5s infinite alternate;
}

.app-icon:nth-child(2){animation-delay:.3s}
.app-icon:nth-child(3){animation-delay:.6s}
.app-icon:nth-child(4){animation-delay:.9s}

@keyframes appFloat {
  to {transform:translateY(-15px) rotate(10deg)}
}

.people {
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:12px;
  flex-wrap:wrap;
}

.person {
  width:80px;
  height:105px;
  background:#ffffffc9;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 7px 15px #476b9520;
  animation:personMove 2s infinite alternate;
}

.person:nth-child(2){animation-delay:.4s}
.person:nth-child(3){animation-delay:.8s}
.person:nth-child(4){animation-delay:1.2s}

.person span {font-size:36px}
.person small {font-size:10px;color:#42638a;font-weight:600}

@keyframes personMove {
  to {transform:translateY(-9px)}
}

.data-stream {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  max-width:400px;
  margin:10px auto;
}

.data-item {
  background:#ffffffdc;
  border-radius:10px;
  padding:10px 13px;
  color:#4487bc;
  font-size:17px;
  font-weight:700;
  box-shadow:0 5px 10px #426b9420;
  animation:dataFall 2s infinite alternate;
}

.data-item:nth-child(even){animation-delay:.4s}

@keyframes dataFall {
  to {transform:translateY(-8px) rotate(5deg)}
}

.book {
  background:#fff;
  width:180px;
  min-height:80px;
  border-radius:8px;
  padding:10px;
  margin:5px auto;
  box-shadow:0 8px 18px #456b9530;
  transform:rotate(-3deg);
  text-align:left;
  font-size:10px;
  color:#4e78a2;
}

.book strong {
  display:block;
  text-align:center;
  font-size:13px;
  margin-bottom:5px;
  color:#367ec0;
}

.book p {margin:4px 0}

.puzzle {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:15px auto;
  max-width:450px;
}

.puzzle div {
  width:105px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  color:white;
  font-size:11px;
  font-weight:600;
  box-shadow:0 5px 12px #315e9235;
  animation:puzzleIn .8s backwards;
}

.puzzle div:nth-child(1){background:#55a6e9}
.puzzle div:nth-child(2){background:#9a85e8;animation-delay:.2s}
.puzzle div:nth-child(3){background:#ec8cb9;animation-delay:.4s}
.puzzle div:nth-child(4){background:#57c4a0;animation-delay:.6s}
.puzzle div:nth-child(5){background:#eeb45d;animation-delay:.8s}

@keyframes puzzleIn {
  from {transform:scale(0) rotate(-90deg);opacity:0}
  to {transform:scale(1) rotate(0);opacity:1}
}

.caption {
  position:absolute;
  z-index:5;
  bottom:12px;
  left:5%;
  width:90%;
  background:#102b50db;
  color:white;
  padding:12px 18px;
  border-radius:13px;
  font-size:clamp(11px,1.4vw,15px);
  line-height:1.7;
  text-align:center;
  box-shadow:0 5px 20px #193a5b30;
  min-height:53px;
}

.controls {
  padding:18px 22px;
}

.progress-info {
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#7892ad;
  margin-bottom:8px;
}

.progress {
  height:7px;
  background:#e9f0f8;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:16px;
}

.progress-bar {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#4b9ce8,#a68bff,#f39dc8);
  border-radius:20px;
  transition:width .3s;
}

.control-buttons {
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button {
  font-family:inherit;
  border:none;
  cursor:pointer;
  border-radius:12px;
  padding:11px 19px;
  font-size:13px;
  font-weight:600;
  transition:.2s;
}

button:hover {transform:translateY(-2px);filter:brightness(1.04)}

.primary {
  background:linear-gradient(135deg,#438fe5,#6f9ef2);
  color:white;
  box-shadow:0 5px 12px #438fe53d;
}

.secondary {
  background:#edf4fc;
  color:#4778ad;
}

.sound-btn {
  background:#f5efff;
  color:#8b71ce;
}

.footer {
  text-align:center;
  padding:12px;
  font-size:11px;
  color:#9aabc0;
  border-top:1px solid #eef2f8;
}

@media(max-width:600px) {
  body {padding:8px}
  .container {border-radius:17px}
  .screen {aspect-ratio:4/5;min-height:470px}
  .scene-content {padding:15px 10px 85px}
  .caption {bottom:8px;padding:9px 10px;font-size:11px}
  .object {width:62px;height:60px;font-size:26px}
  .people {gap:7px}
  .person {width:68px;height:90px}
  .gift {width:43px;height:48px}
  .puzzle div {width:85px}
  .header {padding:13px}
  .brand {font-size:13px}
  button {padding:10px 13px;font-size:11px}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition:none !important;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="brand">🤖 OS <span>LEARNING</span></div>
    <small>สื่อแอนิเมชันประกอบการเรียนรู้</small>
  </header>

  <main class="screen scene-1" id="screen">
    <div class="scene-bg"></div>
    <div class="stars" id="stars"></div>
    <div class="scene-content" id="sceneContent"></div>
    <div class="caption" id="caption">ยินดีต้อนรับเข้าสู่โลกมหัศจรรย์ของระบบคอมพิวเตอร์!</div>
  </main>

  <section class="controls">

    <div class="progress-info">
      <span id="sceneName">ฉากที่ 1 : เปิดเรื่อง</span>
      <span id="timeText">00:00 / 02:00</span>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="control-buttons">
      <button class="secondary" onclick="restart()">↺ เริ่มใหม่</button>
      <button class="primary" id="playBtn" onclick="togglePlay()">▶ เล่นแอนิเมชัน</button>
      <button class="secondary" onclick="previousScene()">◀ ก่อนหน้า</button>
      <button class="secondary" onclick="nextScene()">ถัดไป ▶</button>
      <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊 เปิดเสียง</button>
    </div>

  </section>

  <footer class="footer">
    COMPUTER OPERATING SYSTEMS | ระบบคอมพิวเตอร์และองค์ประกอบทั้ง 5 ส่วน
  </footer>

</div>

<script>
/* ===================================
   ข้อมูลแอนิเมชัน 6 ฉาก
=================================== */

const scenes = [

{
 name:"ฉากที่ 1 : เปิดเรื่อง",
 duration:15,
 title:"เบื้องหลังความมหัศจรรย์",
 subtitle:"มารู้จักโลกของระบบคอมพิวเตอร์กันเถอะ!",
 speech:"ทุกคนเคยสงสัยไหมครับว่า ทำไมคอมพิวเตอร์เครื่องโปรดถึงทำงานให้เราได้ดั่งใจ? ความจริงแล้ว มันไม่ได้มีแค่ตัวเครื่องคอมพิวเตอร์อย่างเดียวนะครับ!",
 visual:`
   <div class="scene-label">✨ WELCOME TO THE COMPUTER WORLD ✨</div>
   <h1 class="scene-title">เบื้องหลังความมหัศจรรย์<br>ของระบบคอมพิวเตอร์</h1>
   <div class="robot-wrap">
     <div class="robot-speech">สวัสดีครับ! ผมมีเรื่องสนุกจะเล่าให้ฟัง</div>
     <div class="robot">
       <div class="robot-head">
         <div class="robot-eyes"><i></i><i></i></div>
         <div class="robot-mouth"></div>
       </div>
       <div class="robot-body"></div>
       <div class="robot-arm left"></div>
       <div class="robot-arm right"></div>
     </div>
   </div>
   <div class="gift-row">
     <div class="gift"></div><div class="gift"></div>
     <div class="gift"></div><div class="gift"></div>
     <div class="gift"></div>
   </div>
 `,
 caption:"ทุกคนเคยสงสัยไหมครับว่า... ทำไมคอมพิวเตอร์เครื่องโปรดถึงทำงานให้เราได้ดั่งใจ?"
},

{
 name:"ฉากที่ 2 : ฮาร์ดแวร์ (Hardware)",
 duration:20,
 title:"ฮาร์ดแวร์ (Hardware)",
 subtitle:"อุปกรณ์ที่สามารถจับต้องได้",
 speech:"ส่วนแรกที่เราคุ้นเคยกันดีคือ ฮาร์ดแวร์ หรือกายหยาบของคอมพิวเตอร์ ทุกชิ้นส่วนที่เราจับต้องได้ ไม่ว่าจะเป็นจอภาพ คีย์บอร์ด เมาส์ หรือสมองกลอย่าง CPU ที่คอยประมวลผลคำสั่งต่าง ๆ ครับ",
 visual:`
   <div class="scene-label">PART 01 · HARDWARE</div>
   <h1 class="scene-title">ฮาร์ดแวร์ (Hardware) 🖥️</h1>
   <p class="scene-subtitle">อุปกรณ์ที่เราสามารถมองเห็นและสัมผัสได้</p>
   <div class="computer">
     <div class="monitor">💻</div>
     <div class="monitor-stand"></div>
     <div class="monitor-base"></div>
   </div>
   <div class="object-row">
     <div class="object">🖥️<small>จอภาพ</small></div>
     <div class="object">⌨️<small>คีย์บอร์ด</small></div>
     <div class="object">🖱️<small>เมาส์</small></div>
     <div class="object">🧠<small>CPU</small></div>
   </div>
   <div class="robot-wrap" style="position:absolute;right:5%;top:38%">
     <div class="robot" style="transform:scale(.65)">
       <div class="robot-head"><div class="robot-eyes"><i></i><i></i></div><div class="robot-mouth"></div></div>
       <div class="robot-body"></div>
       <div class="robot-arm left"></div><div class="robot-arm right"></div>
     </div>

/* ===================================
   ตัวแปรควบคุม
=================================== */

let currentScene = 0;
let playing = false;
let soundEnabled = false;
let elapsed = 0;
let lastTime = 0;
let animationFrame = null;
let speechTimer = null;
let audioContext = null;

const totalDuration = scenes.reduce((sum,s)=>sum+s.duration,0);

const screen = document.getElementById("screen");
const sceneContent = document.getElementById("sceneContent");
const caption = document.getElementById("caption");
const progressBar = document.getElementById("progressBar");
const playBtn = document.getElementById("playBtn");

/* ===================================
   ดาวประกายแสง
=================================== */

function createStars() {
 const container = document.getElementById("stars");
 container.innerHTML = "";

 for(let i=0;i<25;i++){
   const star = document.createElement("div");
   star.className = "star";
   star.innerHTML = ["✦","✧","·","✨"][i%4];
   star.style.left = Math.random()*95+"%";
   star.style.top = Math.random()*85+"%";
   star.style.animationDelay = Math.random()*2+"s";
   star.style.fontSize = (10+Math.random()*17)+"px";
   container.appendChild(star);
 }
}

/* ===================================
   แสดงฉาก
=================================== */

function renderScene(index) {
 currentScene = index;
 const scene = scenes[index];

 screen.className = "screen scene-"+(index+1);
 sceneContent.innerHTML = scene.visual;
 caption.textContent = scene.caption;

 document.getElementById("sceneName").textContent = scene.name;

 createStars();
 updateProgress();
}

/* ===================================
   เสียงประกอบด้วย Web Audio
=================================== */

function initAudio() {
 if(!audioContext) {
   const AudioCtx = window.AudioContext || window.webkitAudioContext;
   if(AudioCtx) audioContext = new AudioCtx();
 }

 if(audioContext && audioContext.state === "suspended") {
   audioContext.resume();
 }
}

function beep(freq=600,duration=.15,type="sine",volume=.06) {
 if(!soundEnabled) return;

 initAudio();
 if(!audioContext) return;

 const oscillator = audioContext.createOscillator();
 const gain = audioContext.createGain();

 oscillator.type = type;
 oscillator.frequency.setValueAtTime(freq,audioContext.currentTime);

 gain.gain.setValueAtTime(volume,audioContext.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);

 oscillator.connect(gain);
 gain.connect(audioContext.destination);

 oscillator.start();
 oscillator.stop(audioContext.currentTime+duration);
}

function playSFX(index) {
 if(!soundEnabled) return;

 const sounds = {
  0:()=>{beep(500,.2);setTimeout(()=>beep(800,.2),150);setTimeout(()=>beep(1000,.3),300)},
  1:()=>{beep(500,.15);setTimeout(()=>beep(700,.15),150);setTimeout(()=>beep(900,.25),300)},
  2:()=>{beep(900,.1);setTimeout(()=>beep(1200,.2),120);setTimeout(()=>beep(700,.25),300)},
  3:()=>{beep(550,.2);setTimeout(()=>beep(750,.2),200);setTimeout(()=>beep(950,.25),400)},
  4:()=>{beep(450,.1);setTimeout(()=>beep(650,.1),150);setTimeout(()=>beep(850,.25),300)},
  5:()=>{beep(600,.2);setTimeout(()=>beep(800,.2),200);setTimeout(()=>beep(1000,.3),400)}
 };

 sounds[index]();
}

/* ===================================
   เสียงบรรยายภาษาไทย
=================================== */

function speakScene(index) {
 if(!soundEnabled || !("speechSynthesis" in window)) return;

 window.speechSynthesis.cancel();

 const utterance = new SpeechSynthesisUtterance(scenes[index].speech);
 utterance.lang = "th-TH";
 utterance.rate = 0.92;
 utterance.pitch = 1.05;
 utterance.volume = 1;

 window.speechSynthesis.speak(utterance);
}

function stopSpeech() {
 if("speechSynthesis" in window) {
   window.speechSynthesis.cancel();
 }
}

/* ===================================
   การเล่นแอนิเมชัน
=================================== */

function startScene() {
 renderScene(currentScene);
 playSFX(currentScene);
 speakScene(currentScene);
}

function togglePlay() {
 if(playing) {
   pause();
 } else {
   play();
 }
}

function play() {
 if(currentScene===0 && elapsed===0) {
   startScene();
 } else if(!playing) {
   startScene();
 }

 initAudio();

 playing = true;
 lastTime = performance.now();

 playBtn.innerHTML = "Ⅱ หยุดชั่วคราว";

 cancelAnimationFrame(animationFrame);
 animationFrame = requestAnimationFrame(update);
}

function pause() {
 playing = false;
 stopSpeech();
 cancelAnimationFrame(animationFrame);
 playBtn.innerHTML = "▶ เล่นต่อ";
}

function update(timestamp) {
 if(!playing) return;

 const delta = Math.min((timestamp-lastTime)/1000,.1);
 lastTime = timestamp;

 elapsed += delta;

 let accumulated = 0;
 let newIndex = 0;

 for(let i=0;i<scenes.length;i++) {
   if(elapsed >= accumulated + scenes[i].duration) {
     accumulated += scenes[i].duration;
     newIndex = i+1;
   } else {
     newIndex = i;
     break;
   }
 }

 if(newIndex >= scenes.length) {
   finish();
   return;
 }

 if(newIndex !== currentScene) {
   currentScene = newIndex;
   startScene();
 }

 updateProgress();
 animationFrame = requestAnimationFrame(update);
}

function updateProgress() {
 const progress = Math.min(elapsed/totalDuration*100,100);
 progressBar.style.width = progress+"%";

 const min = Math.floor(elapsed/60);
 const sec = Math.floor(elapsed%60);

 document.getElementById("timeText").textContent =
   `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")} / 02:00`;
}

function finish() {
 elapsed = totalDuration;
 playing = false;
 stopSpeech();
 cancelAnimationFrame(animationFrame);

 currentScene = scenes.length-1;
 renderScene(currentScene);
 progressBar.style.width = "100%";
 document.getElementById("timeText").textContent = "02:00 / 02:00";

 playBtn.innerHTML = "↺ เล่นอีกครั้ง";
 playSFX(5);
}

function restart() {
 pause();
 elapsed = 0;
 currentScene = 0;
 renderScene(0);
 playBtn.innerHTML = "▶ เล่นแอนิเมชัน";
 updateProgress();
}

function nextScene() {
 pause();

 let time = 0;
 for(let i=0;i<=currentScene;i++) {
   time += scenes[i].duration;
 }

 elapsed = time;
 currentScene = Math.min(currentScene+1,scenes.length-1);

 startScene();
 updateProgress();
}

function previousScene() {
 pause();

 let time = 0;
 for(let i=0;i<Math.max(0,currentScene-1);i++) {
   time += scenes[i].duration;
 }

 elapsed = time;
 currentScene = Math.max(0,currentScene-1);

 startScene();
 updateProgress();
}

function toggleSound() {
 soundEnabled = !soundEnabled;

 document.getElementById("soundBtn").innerHTML =
   soundEnabled ? "🔊 เปิดเสียง" : "🔇 ปิดเสียง";

 if(soundEnabled) {
   initAudio();
   playSFX(currentScene);
   if(playing) speakScene(currentScene);
 } else {
   stopSpeech();
 }
}

/* ===================================
   เริ่มต้น
=================================== */

createStars();
renderScene(0);
updateProgress();

</script>
