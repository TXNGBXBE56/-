
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>องค์ประกอบของคอมพิวเตอร์ | 2D Animation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box}

:root{
  --purple:#9270d8;
  --pink:#f39cbd;
  --blue:#75b9ed;
  --yellow:#ffd66f;
  --ink:#55466d;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 15% 15%,#ffe4f2,transparent 35%),
    radial-gradient(circle at 85% 80%,#d5f3ff,transparent 35%),
    linear-gradient(135deg,#f5eaff,#e8f5ff);
  font-family:'Noto Sans Thai',sans-serif;
  color:var(--ink);
}

.app{width:min(100%,1050px)}

.heading{
  text-align:center;
  font-size:clamp(22px,4vw,32px);
  font-weight:800;
  color:#8661bd;
  margin-bottom:14px;
}

.heading span{color:#f18ab3}

.stage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border:7px solid white;
  border-radius:25px;
  background:#dff1ff;
  box-shadow:0 18px 55px #8b75bd40;
  isolation:isolate;
}

/* ห้องเรียน */
.room{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,#dceeff 0%,#f9eafa 75%,#ead9f5 100%);
  overflow:hidden;
}

.window{
  position:absolute;
  left:3%;
  top:9%;
  width:20%;
  height:38%;
  background:linear-gradient(145deg,#a8e2ff,#d6f5ff);
  border:8px solid #fff;
  border-radius:12px;
  box-shadow:0 5px 15px #7a9fc533;
}

.window:before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  height:100%;
  width:6px;
  background:#fff;
}
.window:after{
  content:"";
  position:absolute;
  top:50%;
  width:100%;
  height:6px;
  background:#fff;
}

.sun{
  position:absolute;
  top:6%;
  left:13%;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ffe28b;
  box-shadow:0 0 35px #ffdf87;
  animation:sunGlow 3s infinite alternate;
}

@keyframes sunGlow{
  to{box-shadow:0 0 55px #ffcf69;transform:scale(1.1)}
}

.shelf{
  position:absolute;
  right:3%;
  top:10%;
  width:13%;
  height:4%;
  background:#b68cbd;
  border-radius:5px;
  box-shadow:0 45px 0 #b68cbd,0 90px 0 #b68cbd;
}

.book{
  position:absolute;
  right:4%;
  top:3%;
  width:3%;
  height:8%;
  background:#f3a3c4;
  border-radius:4px;
  box-shadow:15px 4px #8dc9ed,30px 0 #f8d16f;
}

.floor{
  position:absolute;
  bottom:0;
  height:19%;
  width:100%;
  background:linear-gradient(180deg,#e9d8ed,#d4c3e5);
  border-top:5px solid #fff;
}

.floor:after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:2px;
  background:#ffffff80;
}

/* กระดาน */
.board{
  position:absolute;
  right:4%;
  top:8%;
  width:58%;
  height:76%;
  border:9px solid #b987a7;
  border-radius:17px;
  background:linear-gradient(145deg,#fffdfd,#f4f0ff);
  box-shadow:0 9px 0 #946b9a,0 15px 25px #76628a30;
  overflow:hidden;
}

.board-title{
  position:absolute;
  top:7%;
  left:5%;
  right:5%;
  text-align:center;
  font-size:clamp(16px,2.6vw,27px);
  font-weight:800;
  color:#8665c3;
}

.board-sub{
  position:absolute;
  top:19%;
  left:8%;
  right:8%;
  text-align:center;
  font-size:clamp(11px,1.5vw,16px);
  color:#9b85ad;
}

.lesson{
  position:absolute;
  left:6%;
  right:6%;
  top:34%;
  height:52%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4%;
}

.lesson-card{
  width:100%;
  height:100%;
  border-radius:22px;
  background:linear-gradient(135deg,#f0e8ff,#e7f5ff);
  border:3px solid white;
  box-shadow:0 6px 20px #a28cc32b;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  opacity:0;
  transform:translateY(25px) scale(.85);
  transition:.65s cubic-bezier(.2,.8,.2,1);
  text-align:center;
  padding:12px;
}

.lesson-card.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

.lesson-icon{
  font-size:clamp(40px,8vw,75px);
  line-height:1.3;
  filter:drop-shadow(0 5px 5px #00000013);
  animation:iconFloat 2.5s ease-in-out infinite;
}

@keyframes iconFloat{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-9px) rotate(3deg)}
}

.lesson-name{
  font-size:clamp(17px,2.5vw,27px);
  font-weight:800;
  color:#815fba;
  margin:5px 0;
}

.lesson-desc{
  font-size:clamp(10px,1.4vw,15px);
  color:#726783;
  line-height:1.6;
}

/* ตัวละครครู */
.teacher{
  position:absolute;
  left:2%;
  bottom:10%;
  width:37%;
  height:75%;
  z-index:5;
  transform-origin:50% 100%;
  animation:teacherFloat 3s ease-in-out infinite;
}

@keyframes teacherFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

.teacher svg{width:100%;height:100%;overflow:visible}

#teacherHead{
  transform-box:fill-box;
  transform-origin:50% 90%;
  animation:headMove 4s ease-in-out infinite;
}

@keyframes headMove{
  0%,100%{transform:rotate(0)}
  50%{transform:rotate(-2deg)}
}

#teacherMouth{
  transform-origin:center;
  animation:talk 0.28s infinite alternate;
}

@keyframes talk{
  from{transform:scaleY(.35)}
  to{transform:scaleY(1)}
}

#teacherEyes{
  transform-origin:center;
  animation:blink 4s infinite;
}

@keyframes blink{
  0%,45%,49%,100%{transform:scaleY(1)}
  47%{transform:scaleY(.08)}
}

#teacherArm{
  transform-box:fill-box;
  transform-origin:20% 15%;
  animation:pointing 3s ease-in-out infinite;
}

@keyframes pointing{
  0%,100%{transform:rotate(-4deg)}
  50%{transform:rotate(8deg)}
}

/* กล่องคำพูด */
.speech{
  position:absolute;
  left:3%;
  top:4%;
  max-width:35%;
  padding:12px 17px;
  border:3px solid white;
  border-radius:20px 20px 20px 5px;
  background:#fff;
  color:#805fae;
  font-size:clamp(11px,1.7vw,17px);
  font-weight:700;
  line-height:1.5;
  z-index:8;
  box-shadow:0 5px 15px #7863a326;
  animation:speechPop .6s ease;
}

@keyframes speechPop{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}

/* ดาว */
.star{
  position:absolute;
  color:#ffcf62;
  font-size:25px;
  z-index:7;
  pointer-events:none;
  animation:star 2.4s ease-in-out infinite;
}
.star.a{left:39%;top:15%}
.star.b{right:8%;top:35%;animation-delay:.7s}
.star.c{left:40%;bottom:13%;animation-delay:1.2s}
.star.d{right:32%;bottom:13%;animation-delay:.4s}

@keyframes star{
  0%,100%{opacity:.3;transform:scale(.65) rotate(0)}
  50%{opacity:1;transform:scale(1.25) rotate(40deg)}
}

/* ปุ่มควบคุม */
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-top:17px;
}

button{
  border:0;
  border-radius:30px;
  padding:12px 21px;
  background:white;
  color:#7959aa;
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 5px 15px #8d75b733;
  transition:.2s;
}

button:hover{transform:translateY(-3px);background:#f7eaff}
button:active{transform:scale(.96)}

button.primary{
  color:white;
  background:linear-gradient(120deg,#b58be8,#83b9ed);
}

button.sound{
  background:#fff0f6;
  color:#d77ba5;
}

.progress{
  height:9px;
  margin-top:14px;
  border-radius:20px;
  background:#ffffffa8;
  overflow:hidden;
}

.bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#d28de9,#76c9ed,#f5bd79);
  border-radius:20px;
}

.note{
  text-align:center;
  color:#9585a9;
  font-size:12px;
  margin-top:10px;
}

@media(max-width:550px){
  body{padding:8px}
  .stage{border-width:4px;border-radius:15px}
  .board{border-width:5px}
  .speech{padding:7px 9px}
  button{padding:9px 13px;font-size:13px}
}
</style>
</head>

<body>

    desc:"วิธีการหรือกระบวนการทำงานของระบบ",
    speech:"และส่วนสุดท้ายคือขั้นตอนการปฏิบัติงานค่ะ เป็นวิธีการใช้งานระบบคอมพิวเตอร์อย่างเป็นลำดับ",

const $ = id => document.getElementById(id);

let sceneIndex=0;
let elapsed=0;
let startedAt=0;
let playing=false;
let soundOn=true;
let animationFrame=null;
let totalDuration=scenes.reduce((sum,s)=>sum+s.duration,0);
let audioContext=null;
let voices=[];
let currentUtterance=null;

const card=$("lessonCard");

function loadVoices(){
  if("speechSynthesis" in window){
    voices=window.speechSynthesis.getVoices();
  }
}

if("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}

function speak(text){
  if(!soundOn || !("speechSynthesis" in window))return;

  speechSynthesis.cancel();

  currentUtterance=new SpeechSynthesisUtterance(text);
  currentUtterance.lang="th-TH";
  currentUtterance.rate=.92;
  currentUtterance.pitch=1.08;
  currentUtterance.volume=1;

  const thaiVoice=voices.find(v=>v.lang.toLowerCase().startsWith("th"));
  if(thaiVoice)currentUtterance.voice=thaiVoice;

  speechSynthesis.speak(currentUtterance);
}

function soundEffect(type){
  if(!soundOn)return;

  try{
    if(!audioContext){
      audioContext=new (window.AudioContext||window.webkitAudioContext)();
    }

    if(audioContext.state==="suspended")audioContext.resume();

    const now=audioContext.currentTime;

    function note(freq,start,duration,volume=.04){
      const osc=audioContext.createOscillator();
      const gain=audioContext.createGain();

      osc.type="sine";
      osc.frequency.setValueAtTime(freq,now+start);

      gain.gain.setValueAtTime(.001,now+start);
      gain.gain.exponentialRampToValueAtTime(volume,now+start+.02);
      gain.gain.exponentialRampToValueAtTime(.001,now+start+duration);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start(now+start);
      osc.stop(now+start+duration+.03);
    }

    if(type==="intro"){
      note(523,0,.18);
      note(659,.13,.18);
      note(784,.26,.35);
    }else{
      note(660,0,.12);
      note(880,.10,.18);
    }

  }catch(e){
    console.log("Audio unavailable",e);
  }
}

function showScene(index){
  const s=scenes[index];

  card.classList.remove("show");

  setTimeout(()=>{
    $("boardTitle").textContent=s.title;
    $("boardSub").textContent=s.sub;
    $("lessonIcon").textContent=s.icon;
    $("lessonName").textContent=s.name;
    $("lessonDesc").textContent=s.desc;
    $("speech").textContent=s.speech;

    $("speech").style.animation="none";
    void $("speech").offsetWidth;
    $("speech").style.animation="speechPop .6s ease";

    card.classList.add("show");
  },180);

  soundEffect(index===0?"intro":"change");
  speak(s.voice);
}

function findScene(time){
  let sum=0;
  for(let i=0;i<scenes.length;i++){
    if(time<sum+scenes[i].duration){
      return {index:i,local:time-sum};
    }
    sum+=scenes[i].duration;
  }
  return {index:scenes.length-1,local:scenes.at(-1).duration};
}

function update(time){
  elapsed=Math.min(time,totalDuration);

  const found=findScene(elapsed);

  if(found.index!==sceneIndex){
    sceneIndex=found.index;
    showScene(sceneIndex);
  }

  $("bar").style.width=(elapsed/totalDuration*100)+"%";

  if(elapsed>=totalDuration){
    pause();
    return;
  }

  animationFrame=requestAnimationFrame(tick);
}

function tick(now){
  if(!playing)return;
  update(now-startedAt);
}

function play(){
  if(playing)return;

  if(elapsed>=totalDuration){
    elapsed=0;
    sceneIndex=0;
    showScene(0);
  }

  if(soundOn){
    try{
      if(!audioContext){
        audioContext=new (window.AudioContext||window.webkitAudioContext)();
      }
      audioContext.resume();
    }catch(e){}
  }

  playing=true;
  startedAt=performance.now()-elapsed;
  animationFrame=requestAnimationFrame(tick);
}

function pause(){
  playing=false;
  cancelAnimationFrame(animationFrame);

  if("speechSynthesis" in window){
    speechSynthesis.pause();
  }
}

function restart(){
  pause();
  if("speechSynthesis" in window)speechSynthesis.cancel();

  elapsed=0;
  sceneIndex=0;
  $("bar").style.width="0%";
  showScene(0);
  play();
}

$("play").addEventListener("click",play);
$("pause").addEventListener("click",pause);
$("restart").addEventListener("click",restart);

$("sound").addEventListener("click",()=>{
  soundOn=!soundOn;
  $("sound").textContent=soundOn?"🔊 ปิดเสียง":"🔇 เปิดเสียง";

  if(!soundOn && "speechSynthesis" in window){
    speechSynthesis.cancel();
  }
});

showScene(0);
</script>
